[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-research"
version = "0.1.0"
description = "Reproducible classical-versus-QML biomedical benchmark workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pennylane>=0.42,<1",
  "pennylane-lightning>=0.42,<1",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "ucimlrepo>=0.0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
qml-research = "qml_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "online: requires network access to an authoritative dataset source",
  "quantum: executes PennyLane circuits",
  "slow: executes a research-scale experiment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

