name: laptop_wdbc_training
dataset: wdbc
sample_sizes: [200, full]
seeds: [42]
folds: 5
feature_counts: [2]
reduction_methods: [pca]
models: [logistic_regression, linear_svm, rbf_svm, random_forest, qksvm, vqc]
feature_maps: [angle]
vqc_layers: [2]
