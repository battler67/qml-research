name: heart_phase1_checkpoint
dataset: heart
sample_sizes: [50, 100, 200]
seeds: [42]
folds: 5
fold_limit: 1
feature_counts: [4]
reduction_methods: [pca]
models: [logistic_regression, linear_svm, rbf_svm, random_forest, qksvm, vqc]
feature_maps: [angle]
vqc_layers: [1]
vqc_steps: 100
vqc_batch_size: 16
optimizer: adam
learning_rate: 0.05
backend: default.qubit
shots: null
noise_strength: 0.0
include_full_classical: true
max_runtime_hours: 2
metadata:
  evidence_scope: fixed-fold cross-dataset scaling checkpoint
  limitation: one fold and one seed; use heart_benchmark.yaml for confirmatory runs
