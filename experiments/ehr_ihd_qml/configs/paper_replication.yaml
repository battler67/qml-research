experiment:
  name: ehr_ihd_qml
  track: paper_replication
  mode: bounded_replication
  profile: laptop_8gb
  seed: 42
  output_dir: results/ehr_ihd_qml
resources:
  memory_limit_gb: 5.5
  max_kernel_evaluations: 20000
feature_selection:
  method: consensus
  consensus_method: rank_average
  n_features: 10
quantum:
  features: 10
  layers: 1
  backend: statevector
  shots: null
  real_hardware_submit: false
qsvm:
  model: oqsvm
  feature_map: pauli
  paulis: [Z, ZZ]
  feature_map_reps: 2
  entanglement: linear
  C: 1.0
qmlp:
  quantum_features: 10
  ansatz: u3_cnot
  optimizer: adam
  learning_rate: 0.01
  weight_decay: 0.0
  dropout: 0.1
  init_scale: 0.05
  entanglement: linear
  loss: mse_paper_ablation
models:
  classical: [logistic, linear_svm, rbf_svm, random_forest, classical_mlp]
  qmlp_variants:
    - name: hqmlp_paper_ablation
      ansatz: u3_cnot
      loss: mse_paper_ablation
    - name: hqmlp_preferred
      ansatz: ry_rz_cnot
      loss: bce_logits
training:
  quantum_train_limit: 50
  qmlp_epochs: 3
  bootstrap_iterations: 200
evaluation:
  threshold_strategy: youden_j
